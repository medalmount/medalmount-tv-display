<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Medal Mounting – Portrait TV</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071526}
#portrait-stage{position:fixed;left:0;top:0;width:100vh;height:100vw;transform-origin:top left;transform:translateX(100vw) rotate(90deg);overflow:hidden;background:#071526}
#display{display:block;border:0;width:100%;height:100%;margin:0;padding:0;background:#071526}
</style>
</head>
<body>
<div id="portrait-stage"><iframe id="display" src="index.html" title="Medal Mounting Shop Display"></iframe></div>
<script>
(function(){
  const frame=document.getElementById('display');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument||frame.contentWindow.document;
      const style=doc.createElement('style');
      style.textContent=`
        html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#071526!important}
        #tv-rotator{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;transform:none!important;transform-origin:initial!important;overflow:hidden!important;background:#071526!important}
        #screen{width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;margin:0!important}
        @media (orientation:landscape){#screen{width:100vw!important;height:100vh!important}}
      `;
      doc.head.appendChild(style);
    }catch(e){console.log('Portrait display override:',e);}
  });
  setTimeout(function(){location.reload();},6*60*60*1000);
})();
</script>
</body>
</html>
