name: Update conflict headlines
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current English conflict headlines
        shell: python
        run: |
          import json, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          q='(Ukraine OR Gaza OR Israel OR Iran OR Sudan OR Myanmar OR "DR Congo" OR Yemen) (war OR conflict OR fighting OR ceasefire OR strike OR attack) when:1d'
          url='https://news.google.com/rss/search?'+urllib.parse.urlencode({'q':q,'hl':'en-AU','gl':'AU','ceid':'AU:en'})
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 MedalMountDisplay/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              root=ET.fromstring(r.read())
          allowed=('Reuters','BBC','ABC News','Associated Press','AP News','The Guardian','Al Jazeera')
          items=[]
          seen=set()
          for it in root.findall('.//item'):
              title=(it.findtext('title') or '').strip()
              link=(it.findtext('link') or '').strip()
              source_el=it.find('source')
              source=(source_el.text or '').strip() if source_el is not None else ''
              if not title or not link or not any(a.lower() in source.lower() for a in allowed):
                  continue
              # Google often appends the source to the title; remove it for a cleaner ticker.
              suffix=' - '+source
              if source and title.endswith(suffix):
                  title=title[:-len(suffix)].strip()
              key=title.lower()
              if key in seen:
                  continue
              seen.add(key)
              items.append({'source':source.replace('ABC News','ABC'),'title':title,'url':link})
              if len(items)>=18:
                  break
          if not items:
              raise SystemExit('No suitable English conflict headlines returned; preserving existing file')
          with open('conflict-headlines.json','w',encoding='utf-8') as f:
              json.dump({'updated':datetime.now(timezone.utc).isoformat(),'items':items},f,ensure_ascii=False,indent=2)
      - name: Commit if headlines changed
        run: |
          git config user.name "medalmount-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add conflict-headlines.json
          git diff --cached --quiet && exit 0
          git commit -m "Update current world conflict headlines"
          git push
