<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Medal Mounting Shop Display</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071526}
iframe{display:block;border:0;width:100%;height:100%}
</style>
</head>
<body>
<iframe id="display" title="Medal Mounting Shop Display"></iframe>
<script>
(function(){
  var landscape=window.innerWidth>window.innerHeight;
  document.getElementById('display').src=landscape?'promethean.html?v=20260928-landscape-1':'samsung.html?v=20260924-valid-qr-1';
  var wakeLock=null;
  function wake(){try{if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(function(x){wakeLock=x;x.addEventListener('release',function(){wakeLock=null})}).catch(function(){})}catch(e){}}
  wake();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!wakeLock)wake()});
  window.addEventListener('resize',function(){if((window.innerWidth>window.innerHeight)!==landscape)location.reload()});
  setTimeout(function(){location.reload()},21600000);
})();
</script>
</body>
</html>
