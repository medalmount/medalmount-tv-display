function todayKey(){var p=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),m='',d='';p.forEach(x=>{if(x.type==='month')m=x.value;if(x.type==='day')d=x.value});return m+'-'+d}var TODAY_HISTORY=[],historyIndex=0;function themeFor(e){if(e.theme)return e.theme;var x=((e.category||'')+' '+(e.service||'')).toLowerCase();if(x.includes('police'))return'POLICE SERVICE HISTORY';if(x.includes('fire'))return'FIRE & RESCUE HISTORY';if(x.includes('ambulance')||x.includes('paramedic'))return'AMBULANCE & PARAMEDIC HISTORY';if(x.includes('ses')||x.includes('emergency'))return'SES & EMERGENCY SERVICE HISTORY';if(x.includes('border')||x.includes('customs')||x.includes('immigration'))return'BORDER, CUSTOMS & IMMIGRATION HISTORY';if(x.includes('military')||x.includes('army')||x.includes('navy')||x.includes('air force')||x.includes('adf'))return'AUSTRALIAN MILITARY HISTORY';return'THIS DAY IN AUSTRALIAN SERVICE HISTORY'}function setKicker(t){var k=document.querySelector('.history .kicker');if(k)k.textContent=t}function fallback(){TODAY_HISTORY=[];setKicker('THIS DAY IN AUSTRALIAN SERVICE HISTORY');historyTitle.textContent='Remembering those who served';historyText.textContent='Remembering those who have served Australia — past and present.';medalConnection.textContent='Military • Police • First Responders • Families'}function showHistory(){if(!TODAY_HISTORY.length)return fallback();var e=TODAY_HISTORY[historyIndex%TODAY_HISTORY.length];setKicker(themeFor(e));historyTitle.textContent=e.title||'Australian Service History';historyText.textContent=e.text||'';medalConnection.textContent=(TODAY_HISTORY.length>1?'Event '+((historyIndex%TODAY_HISTORY.length)+1)+' of '+TODAY_HISTORY.length+' • ':'')+(e.service?'['+e.service+'] • ':'')+(e.medalConnection?'Medal connection: '+e.medalConnection:'');historyIndex=(historyIndex+1)%TODAY_HISTORY.length}function getJSON(u){return fetch(u+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if
