<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Medal Mounting Shop Display</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071526}iframe{display:block;border:0;width:100%;height:100%;margin:0;padding:0;background:#071526}</style>
</head>
<body>
<iframe id="display" src="core.html" title="Medal Mounting Shop Display"></iframe>
<script>
(function(){
 const frame=document.getElementById('display');
 frame.addEventListener('load',function(){
  try{
   const doc=frame.contentDocument||frame.contentWindow.document;
   const style=doc.createElement('style');
   style.textContent='.hero img{object-fit:contain!important;background:#0b1520!important}';
   doc.head.appendChild(style);
   const script=doc.createElement('script');
   script.textContent=`
     CONFIG.images = [
       {url:'images/shop-01.jpg', caption:'Custom service presentation framing'},
       {url:'images/shop-03.jpg', caption:'Police service commemorative presentation'}
     ];
     imgIndex=0; showImage();
   `;
   doc.body.appendChild(script);
  }catch(e){console.log('Shop photo loader:',e);}
 });
 setTimeout(function(){location.reload();},6*60*60*1000);
})();
</script>
</body>
</html>
