<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Medal Mounting Shop Display</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071526}iframe{display:block;border:0;width:100%;height:100%;margin:0;padding:0;background:#071526}</style>
</head>
<body>
<iframe id="display" src="core.html?v=20260922-autoimages-nocaptions" title="Medal Mounting Shop Display"></iframe>
<script>
(function(){
 var frame=document.getElementById('display');
 frame.addEventListener('load',function(){
  try{
   var doc=frame.contentDocument||frame.contentWindow.document;
   var style=doc.createElement('style');
   style.textContent='\
    .hero img{object-fit:contain!important;background:#0b1520!important}\
    .hero .caption{display:none!important}\
    .kicker{font-size:1.62vh!important;line-height:1.18!important}\
    .history h2{font-size:2.9vh!important;margin:.7vh 0 .9vh!important}\
    .history p{font-size:1.9vh!important;line-height:1.34!important;margin:.65vh 0!important}\
    .history .medal{font-size:1.62vh!important;line-height:1.3!important;margin-top:1vh!important}\
    .weather{justify-content:center!important}.weather h2{font-size:2.6vh!important;margin:.45vh 0!important}\
    .weather-now{font-size:4.5vh!important;font-weight:700;line-height:1;margin:.75vh 0 .45vh}\
    .weather-condition{font-size:1.9vh!important;font-weight:700;margin-bottom:.6vh}\
    .weather-range{font-size:1.65vh!important;color:#d9e3ec;margin:.25vh 0}\
    .weather-detail{font-size:1.5vh!important;color:#d2dce5;margin-top:.45vh}\
    .weather-error{font-size:1.55vh!important;color:#d2dce5;line-height:1.35}\
    .hours h2{font-size:4.5vh!important;line-height:1!important;margin:.25vh 0 .65vh!important}\
    .hours .row{font-size:2.8vh!important;line-height:1.22!important}\
    .hours>div:last-child{font-size:1.55vh!important;line-height:1.2!important;margin-top:.45vh!important}\
    .contact .web,.contact .phone{font-size:2.8vh!important}.contact .phone{margin-top:.6vh!important}\
    .contact small{font-size:1.45vh!important;line-height:1.25!important;margin-top:.7vh!important}';
   doc.head.appendChild(style);

   var script=doc.createElement('script');
   script.textContent=`
    var FALLBACK_IMAGES=[
     {url:'images/shop-01.jpg',caption:''},
     {url:'images/shop-03.jpg',caption:''}
    ];

    function loadImagesFromGitHub(){
     fetch('https://api.github.com/repos/medalmount/medalmount-tv-display/contents/images?ref=main&t='+Date.now(),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('GitHub image list unavailable');return r.json();})
      .then(function(files){
       var images=files.filter(function(f){
        return f.type==='file' && /\\.(jpe?g|png|webp)$/i.test(f.name) && Number(f.size)>=200000;
       }).sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true});})
       .map(function(f){return {url:f.download_url+'?v='+f.sha,caption:''};});
       if(images.length){CONFIG.images=images;imgIndex=0;showImage();}
       else{CONFIG.images=FALLBACK_IMAGES;imgIndex=0;showImage();}
      })
      .catch(function(){
       if(!CONFIG.images||!CONFIG.images.length){CONFIG.images=FALLBACK_IMAGES;imgIndex=0;showImage();}
      });
    }
    CONFIG.images=FALLBACK_IMAGES;imgIndex=0;showImage();
    loadImagesFromGitHub();
    setInterval(loadImagesFromGitHub,15*60*1000);

    function todayKey(){
     try{
      var p=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),m='',d='';
      for(var i=0;i<p.length;i++){if(p[i].type==='month')m=p[i].value;if(p[i].type==='day')d=p[i].value;}
      return m+'-'+d;
     }catch(e){var x=new Date();return String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
    }
    function historyFallback(){
     document.getElementById('historyTitle').textContent='Remembering those who served';
     document.getElementById('historyText').textContent='Remembering those who have served Australia — past and present.';
     document.getElementById('medalConnection').textContent='Military • Police • First Responders • Families';
    }
    function loadHistory(){
     fetch('history.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json();}).then(function(rows){
      var key=todayKey(),e=null;
      for(var i=0;i<rows.length;i++){if(rows[i].date===key){e=rows[i];break;}}
      if(!e){historyFallback();return;}
      document.getElementById('historyTitle').textContent=e.title||e.displayDate||'Australian Service History';
      document.getElementById('historyText').textContent=e.text||'';
      document.getElementById('medalConnection').textContent=e.medalConnection?'Medal connection: '+e.medalConnection:'';
     }).catch(historyFallback);
    }
    loadHistory(); setInterval(loadHistory,60*60*1000);

    function wx(c){if(c===0)return'Clear';if(c===1)return'Mainly clear';if(c===2)return'Partly cloudy';if(c===3)return'Overcast';if(c===45||c===48)return'Fog';if(c>=51&&c<=57)return'Drizzle';if(c>=61&&c<=67)return'Rain';if(c>=71&&c<=77)return'Snow';if(c>=80&&c<=82)return'Rain showers';if(c>=85&&c<=86)return'Snow showers';if(c>=95)return'Thunderstorm';return'Current conditions';}
    function loadWeather(){
     var b=document.getElementById('weatherPlaceholder'); b.innerHTML='<div class="weather-error">Updating Canberra weather…</div>';
     fetch('https://api.open-meteo.com/v1/forecast?latitude=-35.2809&longitude=149.1300&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Australia%2FSydney&forecast_days=1',{cache:'no-store'}).then(function(r){return r.json();}).then(function(x){
      var c=x.current||{},d=x.daily||{},t=c.temperature_2m,hi=d.temperature_2m_max?d.temperature_2m_max[0]:null,lo=d.temperature_2m_min?d.temperature_2m_min[0]:null,r=d.precipitation_probability_max?d.precipitation_probability_max[0]:null,w=c.wind_speed_10m;
      var h='<div class="weather-now">'+Math.round(t)+'°C</div><div class="weather-condition">'+wx(Number(c.weather_code))+'</div>';
      if(hi!=null&&lo!=null)h+='<div class="weather-range">Today '+Math.round(lo)+'° – '+Math.round(hi)+'°</div>';
      if(r!=null)h+='<div class="weather-detail">Chance of rain '+Math.round(r)+'%</div>';if(w!=null)h+='<div class="weather-detail">Wind '+Math.round(w)+' km/h</div>';b.innerHTML=h;
     }).catch(function(){b.innerHTML='<div class="weather-error">Canberra weather temporarily unavailable</div>';});
    }
    loadWeather();setInterval(loadWeather,15*60*1000);
   `;
   doc.body.appendChild(script);
  }catch(e){console.log('Shop display loader:',e);}
 });
 setTimeout(function(){location.reload();},6*60*60*1000);
})();
</script>
</body>
</html>
